; Kaelix — dispositivo IoT de manutenção preditiva
; TCC Engenharia de Software — ICEV
; ESP32-S3-WROOM-1 N16R8 + MPU6050 + NTC 10K + RA-02 (SX1278) LoRa 433MHz

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<diagnostics/> -<receiver/> -<gateway/> -<transmitter/>
monitor_speed = 115200
; O alvo é o WROOM-1 N16R8: 16MB de flash e 8MB de PSRAM octal. O perfil
; default da devkitc-1 declara 8MB de flash e nenhuma PSRAM, então metade
; da flash e toda a PSRAM ficariam invisíveis.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
; `board_build.flash_size` governa só o lado do build. O cabeçalho da imagem
; sai de `upload.flash_size`, que o perfil da devkitc-1 fixa em 8MB — e o
; elf2image gravava `--flash_size 8MB` numa imagem cuja tabela de partições
; vai até 16MB (app1 termina em 12,6MB; spiffs, em 15,6MB). O app cabe nos
; primeiros 8MB, então nada quebra hoje; OTA, SPIFFS e coredump quebrariam.
; NÃO fixar `board_upload.maximum_size`: a checagem de tamanho tem de
; continuar valendo contra a partição app0 (6,25MB), não contra a flash.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_unflags =
    -std=gnu++11
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -std=gnu++17
lib_deps =
    jrowberg/I2Cdevlib-MPU6050@1.0.0
    jgromes/RadioLib@7.7.1

; Ambiente nativo para rodar os testes unitários (sensors/vibration, temperature)
; sem precisar do hardware ou do simulador — roda no host.
[env:native]
lib_deps = bblanchon/ArduinoJson@7.4.2
platform = native
test_framework = unity
build_flags =
    -std=gnu++17

; Montagem USB: MPU6050 + RA-02 diretamente em 3V3, sem NTC/load switch.
; Upload: pio run -e esp32-s3-bench -t upload
[env:esp32-s3-bench]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -D KAELIX_BENCH=1
    -D KAELIX_HAS_NTC=0
    -D KAELIX_LOG_SERIAL=1
    ; Serial pelo USB Serial/JTAG do S3, sem conversor UART externo.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Diagnóstico bruto pode ser habilitado temporariamente com valor 1.
    -D RADIOLIB_DEBUG_BASIC=0
    -D RADIOLIB_DEBUG_SPI=0

; Diagnóstico de RegVersion: apenas SPI por GPIO e por periférico, sem RF TX.
[env:lora-probe]
extends = env:esp32-s3
build_src_filter = -<*> +<diagnostics/lora_probe.cpp>
lib_deps =

; Gateway S3: RA-02 e Wi-Fi, sem MPU. Recebe do C3 e envia à API.
; Logs em UART0, pelo conversor USB-UART da placa, não pelo USB nativo.
; Upload: pio run -e esp32-s3-gateway -t upload --upload-port <porta>
[env:esp32-s3-gateway]
extends = env:esp32-s3
build_src_filter = -<*> +<receiver/*.cpp>
lib_deps =
    jgromes/RadioLib@7.7.1
    bblanchon/ArduinoJson@7.4.2

; Gateway de campo: Wi-Fi configurado sem cabo, rádio bidirecional, gravador em
; flash e atualização remota. Especificação em kaelix-Ai-center/docs/comando-e-coleta.md.
; Primeira gravação: pio run -e kaelix-gateway -t upload --upload-port <porta>
[env:kaelix-gateway]
extends = env:esp32-s3
build_src_filter = -<*> +<gateway/>
board_build.partitions = partitions/gateway_16MB.csv
lib_deps =
    jgromes/RadioLib@7.7.1
    bblanchon/ArduinoJson@7.4.2

; Transmissor de campo: sinal bruto, configuração e rotina recebidas pelo rádio.
; Primeira gravação: pio run -e kaelix-transmitter -t upload --upload-port <porta>
[env:kaelix-transmitter]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_src_filter = -<*> +<transmitter/> +<sensors/vibration.cpp> +<power/watchdog.cpp> +<power/rtc_watchdog.c>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D KAELIX_BOARD_C3=1
    -D KAELIX_BENCH=1
    -D KAELIX_HAS_NTC=0
    -D KAELIX_LOG_SERIAL=1
lib_deps =
    jgromes/RadioLib@7.7.1

; Device C3: MPU em SDA=20/SCL=21 e RA-02 com a pinagem da bancada.
; Montagem atual: USB/3V3 direto, sem NTC/load switch/deep sleep.
; Mede vibração e transmite v2/21 bytes a cada ~11 s; estado UNKNOWN.
; Upload: pio run -e esp32-c3-device -t upload --upload-port <porta>
[env:esp32-c3-device]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_src_filter = +<*> -<diagnostics/> -<receiver/> -<gateway/> -<transmitter/>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D KAELIX_BOARD_C3=1
    -D KAELIX_BENCH=1
    -D KAELIX_HAS_NTC=0
    -D KAELIX_LOG_SERIAL=1
lib_deps =
    jgromes/RadioLib@7.7.1

; Receptor anterior, preservado para reproduzir a montagem antes da inversão.
; Receptor RA-02 no ESP32-C3 Super Mini (USB nativo, flash de 4 MB).
; Ambiente independente do S3: não herdar configuração de PSRAM/flash N16R8.
[env:esp32-c3-receiver]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_src_filter = -<*> +<receiver/*.cpp>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    jgromes/RadioLib@7.7.1
    bblanchon/ArduinoJson@7.4.2

; Diagnóstico isolado do RA-02 ligado ao C3, sem RadioLib ou recepção.
[env:lora-probe-c3]
extends = env:esp32-c3-receiver
build_src_filter = -<*> +<diagnostics/lora_probe.cpp>
build_flags =
    ${env:esp32-c3-receiver.build_flags}
    -D KAELIX_PROBE_C3=1
lib_deps =
